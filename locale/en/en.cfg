[mod-name]
MapSettingsTuner=Map Settings Tuner

[mod-description]
MapSettingsTuner=Allows you to change your map and map generation settings at any time you want. Map generation changes only apply to new chunks.\n\nCredits: this mod was originally created and developed by Bilka (upstream "Change Map Settings" 5.0.1, MIT license). The Factorio 2.1 adaptation is maintained by Gpx. Thank you, Bilka, for the original work and for releasing it under the MIT license.

