[mod-name]
MapSettingsTuner=地图设置调整器

[mod-description]
MapSettingsTuner=在游戏运行中随时修改地图设置与地图生成设置。地图生成的改动只对新生成的区块生效。\n\n致谢：本模组最初由 Bilka 创作并开发（上游 “Change Map Settings” 5.0.1 版，MIT 许可）。2.1 版本适配由 Gpx 维护。感谢 Bilka 的原始开发贡献与开源授权。

[gui]
change-map-settings-toggle-config-caption=地图设置
change-map-settings-title=地图设置
change-map-settings-toggle-tooltip=点击切换 __1__ 选项
change-map-settings-start-button-caption=应用 __1__
change-map-settings-start-button-tooltip=点击将地图设置修改为当前填写的数值
change-map-settings-default-button-caption=将输入框重置为默认值
change-map-settings-use-current-button-caption=将输入框设为当前设置
change-map-settings-in-unit=__1__（单位：__2__）
change-map-settings-percent=百分比
change-map-settings-evolution-factor-tooltip=当前敌方进化因子
change-map-settings-general-title=通用
change-map-settings-map-gen-title=地图生成设置
change-map-settings-seed-caption=种子（0 表示随机）
change-map-settings-start-map-gen-button-tooltip=点击将当前填写的地图生成设置应用到新生成的区块
change-map-settings-minutes=分钟
change-map-settings-enemy-expansion-min-group-size=扩张队伍最小规模
change-map-settings-enemy-expansion-min-group-size-tooltip=虫族扩张队伍出发时的最小规模，实际规模会随当前进化因子提升。
change-map-settings-enemy-expansion-max-group-size=扩张队伍最大规模
change-map-settings-enemy-expansion-max-group-size-tooltip=虫族扩张队伍出发时的最大规模，实际规模会随当前进化因子提升。
change-map-settings-resource-value-range-tooltip=取值范围：0（无）或 0.17（1/6）～6；默认 1，最大 6。
change-map-settings-cliffs=悬崖
change-map-settings-no-selected-preset=当前地图生成设置

[msg]
change-map-settings-start-admin-restriction=只有管理员可以修改__1__
change-map-settings-invalid-seed=无效的种子
change-map-settings-invalid-evolution-factor=无效的进化因子。可选值：0 到 1
change-map-settings-invalid-evolution-time=无效的进化时间因子。可选值：0 到 0.01
change-map-settings-invalid-evolution-destroy=无效的进化摧毁因子。可选值：0 到 1
change-map-settings-invalid-evolution-pollution=无效的进化污染因子。可选值：0 到 0.01
change-map-settings-invalid-pollution-absorption=无效的污染吸收值。可选值：0.1 到 4
change-map-settings-invalid-enemy-attack-pollution-consumption=无效的攻击消耗系数。可选值：0.1 到 4
change-map-settings-invalid-pollution-tree-dmg=无效的树木受损污染阈值。可选值：0 到 9999
change-map-settings-invalid-pollution-tree-absorb=无效的每棵受损树木吸收污染量。可选值：0 到 9999
change-map-settings-invalid-pollution-diffusion=无效的污染扩散比例。可选值：0 到 25
change-map-settings-invalid-expansion-distance=无效的最大扩张距离。可选值：2 到 20
change-map-settings-invalid-expansion-min-size=无效的扩张队伍最小规模。可选值：1 到 20
change-map-settings-invalid-expansion-max-size=无效的扩张队伍最大规模。可选值：1 到 50，且必须大于最小规模
change-map-settings-invalid-expansion-min-cd=无效的最小扩张冷却时间。可选值：1 到 60
change-map-settings-invalid-expansion-max-cd=无效的最大扩张冷却时间。可选值：5 到 180，且必须大于最小冷却时间
change-map-settings-applied=设置已应用。
change-map-settings-apply-failed=应用设置失败。
